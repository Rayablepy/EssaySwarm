[project]
name = "essayswarm"
version = "0.1.0"
description = "EssaySwarm using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "click>=8.5.0",
    "crewai[tools]>=1.15.33,<2.0.0",
    "transformers[serving]>=5.20.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["agents", "crew.jsonc", "tools", "knowledge", "skills"]

[tool.crewai]
type = "crew"
definition = "crew.jsonc"
project_id = "4cb17fd4-9593-4e39-aa90-298300ab08ca"
